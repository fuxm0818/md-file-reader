name: 功能建议
description: 想要的新功能或体验改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个工具的方向是「离线、边看边听、不打扰」。偏离开这个方向的建议（云同步、
        在线语音、账号体系）大概率不会被采纳，先说在前面。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么问题
      description: 描述场景，不要直接给方案。知道你卡在哪，才可能想出了更好的解法
      placeholder: |
        读技术文档时，代码块会被整段跳过，但代码上面的注释其实想听。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法
      description: 现在是怎么绕过这个问题的？别的软件怎么做的？

  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 这个功能不需要联网
          required: true
